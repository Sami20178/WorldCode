name: Android APK Builder and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'release-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WorldCode.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCode-Studio-APK
          path: WorldCode.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/release-')
        uses: softprops/action-gh-release@v2
        with:
          name: WorldCode Studio
          tag_name: ${{ github.ref_name }}
          body: |
            # WorldCode Studio

            WorldCode Studio ist jetzt erstmals als Android APK verfügbar.

            ## ✨ Funktionen
            - 3D-Viewport mit Three.js
            - Explorer mit Workspace/World/Parts
            - Parts hinzufügen und löschen
            - Objekt auswählen
            - Position X/Y/Z bearbeiten
            - Play/Stop-Modus
            - Mobile-freundliches Layout

            ## 📱 Android APK
            Die APK kann direkt aus diesem Release heruntergeladen und installiert werden.
          files: WorldCode.apk
          fail_on_unmatched_files: true
