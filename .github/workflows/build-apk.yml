name: Build WorldCode APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z.B. 0.0.2'
        required: true
        default: '0.0.2'
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version festlegen
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.2"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$(echo "$VERSION" | awk -F. '{print ($1*10000)+($2*100)+$3}')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version_code }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "WorldCode-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCode-v${{ steps.version.outputs.version }}-apk
          path: WorldCode-v${{ steps.version.outputs.version }}.apk

      - name: Publish APK release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WorldCode ${{ github.ref_name }}
          body: |
            ## WorldCode ${{ github.ref_name }}

            📱 **Android APK herunterladen:**
            Lade die APK unten herunter und installiere sie auf deinem Android-Gerät.
          files: WorldCode-v${{ steps.version.outputs.version }}.apk
          generate_release_notes: false
