name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WorldCode-v0.0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCode-v0.0.1-apk
          path: WorldCode-v0.0.1.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1
          name: WorldCode v0.0.1
          body: |
            ## WorldCode v0.0.1

            📱 **Android APK herunterladen:**
            Lade `WorldCode-v0.0.1.apk` herunter und installiere die App auf deinem Android-Gerät.
          files: WorldCode-v0.0.1.apk
          generate_release_notes: false
