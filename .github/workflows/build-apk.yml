name: Build WorldCode APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and publish WorldCode APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK with automatic version
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug -PversionCode=${{ github.run_number }} -PversionName=0.0.${{ github.run_number }}

      - name: Check APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WorldCode.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCode-APK
          path: WorldCode.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-v0.0.${{ github.run_number }}
          name: WorldCode Studio v0.0.${{ github.run_number }}
          body: |
            # WorldCode Studio

            Neue automatisch gebaute Version von WorldCode Studio.

            ## Android APK
            Die APK kann direkt unter **Assets** heruntergeladen werden.
          files: WorldCode.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
