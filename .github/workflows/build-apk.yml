name: Build WorldCode APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g

jobs:
  build:
    name: Build and publish WorldCode APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew --no-daemon clean

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Find APK
        run: |
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" WorldCode.apk
          ls -lh WorldCode.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCode-APK-${{ github.run_number }}
          path: WorldCode.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-v0.0.${{ github.run_number }}
          name: WorldCode Studio v0.0.${{ github.run_number }}
          body: |
            Neue WorldCode Studio Version.

            **Android APK:** Unter Assets kann `WorldCode.apk` heruntergeladen werden.
          files: WorldCode.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
