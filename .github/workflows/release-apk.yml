name: Build Android APK and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'release-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/WorldCode.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCode-APK
          path: app/build/outputs/apk/debug/WorldCode.apk

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/release-')
        uses: softprops/action-gh-release@v2
        with:
          name: WorldCode Studio
          body: |
            # WorldCode Studio

            WorldCode Studio ist jetzt erstmals als Android APK verfügbar.

            ## ✨ Funktionen
            - 3D-Viewport mit Three.js
            - Explorer mit Workspace/World/Parts
            - Parts hinzufügen und löschen
            - Objekt auswählen
            - Position X/Y/Z bearbeiten
            - Play/Stop-Modus
            - Mobile-freundliches Layout

            Die APK kann direkt aus diesem Release heruntergeladen und installiert werden.
          files: app/build/outputs/apk/debug/WorldCode.apk
