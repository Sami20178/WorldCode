name: Build Android APK and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK v0.0.2
        run: ./gradlew :app:assembleDebug --no-daemon -PversionCode=2 -PversionName=0.0.2

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/WorldCode-v0.0.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCode-v0.0.2-apk
          path: app/build/outputs/apk/debug/WorldCode-v0.0.2.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WorldCode ${{ github.ref_name }}
          body: |
            # WorldCode v0.0.2

            🎉 Reparierte Android-Version.

            ## 📱 Android APK
            **WorldCode-v0.0.2.apk** ist als Release-Datei verfügbar.

            ## 🔧 Reparaturen
            - Zuverlässiger nativer App-Start
            - Kein WebView und keine externe URL beim Start
            - Offline-Start möglich
            - APK-Version korrekt auf v0.0.2 gesetzt
          files: app/build/outputs/apk/debug/WorldCode-v0.0.2.apk
