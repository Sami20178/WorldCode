name: WorldCode Android APK Builder

on:
  workflow_dispatch:
  push:
    tags:
      - 'release-*'

permissions:
  contents: write

jobs:
  build:
    name: Build WorldCode APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Check APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/WorldCode.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCode-APK
          path: app/build/outputs/apk/debug/WorldCode.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/release-')
        uses: softprops/action-gh-release@v2
        with:
          name: WorldCode Studio
          tag_name: ${{ github.ref_name }}
          body: |
            # WorldCode Studio

            WorldCode Studio ist jetzt erstmals als Android APK verfügbar.

            ## ✨ Funktionen
            - 3D-Viewport mit Three.js
            - Explorer mit Workspace/World/Parts
            - Parts hinzufügen und löschen
            - Objekt auswählen
            - Position X/Y/Z bearbeiten
            - Play/Stop-Modus
            - Mobile-freundliches Layout

            ## 📱 Android APK
            Die APK kann direkt aus diesem Release heruntergeladen und installiert werden.
          files: app/build/outputs/apk/debug/WorldCode.apk
          fail_on_unmatched_files: true
