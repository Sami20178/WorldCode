plugins { id 'com.android.application' }

android {
    namespace 'com.sami.worldcode'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sami.worldcode'
        minSdk 23
        targetSdk 35
        def vc = project.hasProperty('versionCode') ? project.property('versionCode').toString() : '2'
        def vn = project.hasProperty('versionName') ? project.property('versionName').toString() : '0.0.2'
        versionCode Integer.parseInt(vc)
        versionName vn
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
