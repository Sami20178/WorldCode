<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WorldCode VS Code Android Edition</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#1e1e1e;color:#ddd}.top{height:48px;background:#181818;display:flex;align-items:center;border-bottom:1px solid #333}.brand{padding:0 14px;font-weight:bold;color:#fff}.top button,.bar button{height:32px;margin:0 3px;background:#2d2d2d;color:#ddd;border:1px solid #444;border-radius:3px;padding:0 10px}.top button:active,.bar button:active{background:#444}.main{height:calc(100% - 48px);display:grid;grid-template-columns:48px 210px 1fr}.activity{background:#181818;border-right:1px solid #333;text-align:center}.activity div{padding:15px 0;font-size:21px}.activity .on{border-left:2px solid #3794ff;background:#252526}.side{background:#252526;border-right:1px solid #333;overflow:auto}.side h3{font-size:12px;font-weight:normal;margin:0;padding:12px;color:#bbb}.file{padding:8px 12px;font-size:13px}.file.active{background:#37373d;color:white}.editor{display:flex;flex-direction:column;min-width:0}.tabs{height:38px;background:#252526;display:flex;border-bottom:1px solid #333}.tab{padding:11px 16px;font-size:13px;background:#1e1e1e;border-right:1px solid #333}.code{flex:1;display:flex;min-height:0}.nums{width:45px;background:#1e1e1e;color:#666;text-align:right;padding:12px 8px;font:14px monospace;line-height:22px;user-select:none}.textarea{flex:1;background:#1e1e1e;color:#d4d4d4;border:0;outline:0;resize:none;padding:12px 10px;font:14px/22px monospace;white-space:pre;overflow:auto}.bottom{height:145px;background:#181818;border-top:1px solid #333}.bar{height:35px;background:#252526;padding:2px 8px}.terminal{height:110px;padding:10px;font:13px monospace;color:#bbb;overflow:auto}.status{height:22px;background:#007acc;color:white;font-size:11px;display:flex;align-items:center;padding:0 8px;position:fixed;bottom:0;left:0;right:0}
@media(max-width:650px){.main{grid-template-columns:42px 165px 1fr}.side{font-size:12px}.brand{font-size:13px;padding:0 7px}.top button{padding:0 6px}}
</style></head>
<body>
<div class="top"><div class="brand">◈ WorldCode</div><button onclick="newFile()">＋</button><button onclick="saveFile()">💾</button><button onclick="runCode()">▶ Run</button><button onclick="toggleTerminal()">Terminal</button></div>
<div class="main">
<div class="activity"><div class="on">📁</div><div>🔍</div><div>⚙️</div></div>
<div class="side"><h3>EXPLORER</h3><div class="file active" onclick="openFile(this)">📄 main.js</div><div class="file" onclick="openFile(this)">📄 index.html</div><div class="file" onclick="openFile(this)">📄 style.css</div><div class="file" onclick="openFile(this)">📁 src</div></div>
<div class="editor"><div class="tabs"><div class="tab">main.js ×</div></div><div class="code"><div class="nums" id="nums">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10</div><textarea class="textarea" id="code" spellcheck="false">// WorldCode VS Code Android Edition

function hello() {
  console.log("Hello from WorldCode!");
}

hello();</textarea></div><div class="bottom" id="terminal"><div class="bar"><button>PROBLEMS</button><button>OUTPUT</button><button>TERMINAL</button></div><div class="terminal" id="output">WorldCode Terminal<br>$ Bereit.<br></div></div></div>
</div><div class="status">main.js &nbsp; | &nbsp; JavaScript &nbsp; | &nbsp; UTF-8 &nbsp; | &nbsp; WorldCode Android</div>
<script>
const code=document.getElementById('code'), output=document.getElementById('output');
code.addEventListener('input',()=>{let n=code.value.split('\n').length;document.getElementById('nums').innerHTML=Array.from({length:Math.max(n,10)},(_,i)=>i+1).join('<br>')});
function newFile(){code.value='// Neue Datei\n\n';code.focus();output.innerHTML+='\n$ Neue Datei erstellt.'}
function saveFile(){localStorage.setItem('worldcode_main',code.value);output.innerHTML+='\n$ Datei lokal gespeichert.'}
function runCode(){output.innerHTML+='\n$ Ausführen...';try{new Function(code.value)();output.innerHTML+='\n$ Fertig.'}catch(e){output.innerHTML+='\nFehler: '+e.message}}
function toggleTerminal(){let t=document.getElementById('terminal');t.style.display=t.style.display==='none'?'block':'none'}
function openFile(e){document.querySelectorAll('.file').forEach(x=>x.classList.remove('active'));e.classList.add('active');output.innerHTML+='\n$ Geöffnet: '+e.textContent.trim()}
const old=localStorage.getItem('worldcode_main');if(old)code.value=old;
</script></body></html>
