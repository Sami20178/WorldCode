<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WorldCode Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#17191d;color:#fff;overflow:hidden}header{height:54px;background:#25282e;display:flex;align-items:center;padding:0 12px;gap:10px;border-bottom:1px solid #3a3d43}header b{font-size:20px}.btn{background:#343941;color:#fff;border:1px solid #4a4e56;border-radius:6px;padding:8px 12px}.green{background:#16834b}.layout{height:calc(100vh - 54px);display:grid;grid-template-columns:210px 1fr 220px}.panel{background:#202329;border-right:1px solid #393c42;overflow:auto}.right{border-left:1px solid #393c42;border-right:0}.title{padding:10px;font-weight:bold;background:#2a2d33}.item{padding:9px 12px;border-bottom:1px solid #30333a}.item.selected{background:#3a5b80}.viewport{position:relative;background:#101216;overflow:hidden}.grid{position:absolute;inset:0;background-image:linear-gradient(#252932 1px,transparent 1px),linear-gradient(90deg,#252932 1px,transparent 1px);background-size:40px 40px;transform:perspective(500px) rotateX(45deg) scale(1.3);transform-origin:center 70%}.cube{position:absolute;width:100px;height:100px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(25deg);background:#4b8bd8;border:3px solid #9cc8ff;box-shadow:20px 20px 0 #315d91}.empty{position:absolute;left:50%;top:18px;transform:translateX(-50%);color:#aaa}.props{padding:10px}.row{display:flex;gap:6px;margin:7px 0;align-items:center}.row label{width:34px;color:#bbb}.row input{width:100%;background:#15171b;border:1px solid #444;color:#fff;padding:7px;border-radius:4px}.bottom{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.small{font-size:12px;color:#aaa;padding:10px}</style>
</head>
<body>
<header><b>WorldCode Studio</b><button class="btn green" onclick="play()">▶ Play</button><button class="btn" onclick="stop()">■ Stop</button><button class="btn" onclick="addPart()">＋ Part</button></header>
<div class="layout">
<section class="panel"><div class="title">Explorer</div><div id="objects"><div class="item selected" onclick="select(this)">▣ Workspace</div><div class="item" onclick="select(this)">◇ Part</div><div class="item" onclick="select(this)">☀ Camera</div><div class="item" onclick="select(this)">☼ Light</div></div></section>
<main class="viewport"><div class="empty">3D Viewport</div><div class="grid"></div><div class="cube" id="cube"></div><div class="bottom"><button class="btn" onclick="move(-10)">←</button><button class="btn" onclick="move(10)">→</button></div></main>
<section class="panel right"><div class="title">Properties</div><div class="props"><b>Part</b><div class="small">Position</div><div class="row"><label>X</label><input id="x" value="0"></div><div class="row"><label>Y</label><input id="y" value="0"></div><div class="row"><label>Z</label><input id="z" value="0"></div><div class="small">Size</div><div class="row"><label>X</label><input value="4"></div><div class="row"><label>Y</label><input value="1"></div><div class="row"><label>Z</label><input value="4"></div></div></section>
</div>
<script>
function select(e){document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected'));e.classList.add('selected')}
function addPart(){let d=document.createElement('div');d.className='item';d.textContent='◇ Part';d.onclick=()=>select(d);document.getElementById('objects').appendChild(d)}
function play(){document.querySelector('.cube').style.background='#35b86b'}
function stop(){document.querySelector('.cube').style.background='#4b8bd8'}
function move(n){let c=document.getElementById('cube');let x=parseInt(c.dataset.x||0)+n;c.dataset.x=x;c.style.marginLeft=x+'px'}
</script>
</body></html>
